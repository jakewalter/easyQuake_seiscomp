# sceasyquake default configuration
# This file is installed to $SEISCOMP_ROOT/etc/defaults/sceasyquake.cfg
# User overrides belong in $SEISCOMP_ROOT/etc/sceasyquake.cfg (managed by scconfig)

# ---------------------------------------------------------------------------
# SeedLink waveform server
#
# SeisComP distributes real-time waveforms internally via its own SeedLink
# server (the 'seedlink' module).  sceasyquake connects to it the same way
# any external client would — this is SeisComP's standard waveform transport
# protocol, not a workaround.  The default localhost:18000 is correct for
# a single-machine deployment; change host/port only if the SeedLink server
# is running on a different machine or port.
# ---------------------------------------------------------------------------
seedlink.host = localhost
seedlink.port = 18000

# ---------------------------------------------------------------------------
# Stream selection
# Comma-separated list of NET.STA.LOC.CHA selectors.
#
# SeedLink wildcard notes:
#   LOC  – use empty (not '*') to mean any location, e.g. CI.STA..HHZ
#           The installer strips '*' and '?' loc codes to empty automatically.
#   CHA  – '?' matches one character; '??Z' or 'HH?' are safe patterns.
#   STA  – '?' per character works portably, e.g. '????' for all 4-char names.
#           '*' is accepted by SeisComP's SeedLink but is not guaranteed by the
#           protocol; prefer '????' or explicit station lists on other servers.
#   NET  – must be an explicit network code (e.g. 'CI'). '*' may cause silent
#           subscription failures on some SeedLink server implementations.
#
# Examples:
#   streams.codes = CI.*.*.HHZ        # ← bad: '*' NET/STA not portable
#   streams.codes = CI.????.*.HH?     # ← good: explicit NET, '?' STA wildcard
#   streams.codes = CI.STA1..HHZ,CI.STA2..HHZ  # explicit list
# ---------------------------------------------------------------------------
# streams.codes = CI.????.*.HH?

# ---------------------------------------------------------------------------
# ML picker
#
# Two backends are available:
#
#   seisbench  – SeisBench (PyTorch).  Supports all three architectures.
#                Custom weights can be loaded via picker.model_path.
#
#   easyquake  – easyQuake TF/Keras wrappers.  Supports phasenet and gpd
#                only.  Always uses built-in pretrained weights; model_path
#                has no effect.
#
# Set picker.backend first, then picker.model.
# ---------------------------------------------------------------------------
picker.backend    = seisbench    # seisbench | easyquake | stub
picker.model      = phasenet     # phasenet | eqtransformer | gpd
                                 #   (eqtransformer only available with seisbench backend)

# seisbench backend: base architecture / pretrained weight set name.
# Used only when picker.model_path is NOT set — names the hub weight set
# downloaded and used directly for inference (e.g. 'stead', 'original').
# When picker.model_path is a raw .pt/.pth file, the hub is never contacted;
# the model is built from the bare constructor and picker.pretrained is ignored.
# When picker.model_path is a SeisBench save directory, picker.pretrained is
# also ignored (all metadata comes from the .json).
picker.pretrained = stead        # phasenet: stead, diting, ethz, scedc, geofon
                                 # gpd: original, scedc, geofon
                                 # eqtransformer: original, ethz, scedc, stead

# seisbench backend: path to custom model weights directory (or .pt file)
# Leave empty to use picker.pretrained weights.
# picker.model_path =

# seisbench backend: amplitude normalization mode ('std' or 'peak').
# When using a raw .pt/.pth custom model, this MUST match how that model
# was trained.  The stead pretrained base uses 'std'; many custom-trained
# PhaseNet models use 'peak'.  Set explicitly to avoid silent mismatch.
# picker.norm = peak

# seisbench backend: output label order your model was trained with.
# SeisBench PhaseNet's native internal order is NPS [0=N, 1=P, 2=S].
# If your custom model was trained with a different output order (e.g. PSN),
# set this so the output layer weights are reordered at load time to match
# seisbench's native layout.  Leave unset to use the model's native order.
# Common values:
#   PSN  – P=0, S=1, N=2 (many JGR / custom-trained PhaseNet models)
#   NPS  – N=0, P=1, S=2 (seisbench PhaseNet default, no reorder needed)
# picker.label_order = PSN

picker.threshold  = 0.5          # probability threshold (P and S)
picker.gpd_threshold = 0.994     # GPD-specific threshold (overrides picker.threshold for gpd model)
picker.device     = cpu          # cpu | cuda
picker.buffer_seconds = 60
picker.step_seconds   = 5
