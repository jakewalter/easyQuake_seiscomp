# scphasepapy default configuration
# Installed to $SEISCOMP_ROOT/etc/defaults/scphasepapy.cfg

phasepapy.db_dir = /tmp/scphasepapy
phasepapy.db_assoc = assoc.db
phasepapy.db_tt = tt.db
phasepapy.max_km = 350
phasepapy.aggregation = 1
phasepapy.aggr_norm = L2
phasepapy.assoc_ot_uncert = 3
# DL pickers rarely co-detect P+S at the same station for small events;
# nsta_declare=1 allows a single-station P+S pair to trigger an event.
# Raise to 2-3 if false positives are too frequent.
phasepapy.nsta_declare = 3
phasepapy.cutoff_outlier = 30
phasepapy.loc_uncert_thresh = 0.3
phasepapy.cycle_seconds = 30
phasepapy.max_pick_age = 3600
