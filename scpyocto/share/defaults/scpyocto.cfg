# scpyocto default configuration
# All parameters can be overridden in $SEISCOMP_ROOT/etc/scpyocto.cfg

# --- Bounding box ---
pyocto.lat_min = 28.0
pyocto.lat_max = 35.0
pyocto.lon_min = -109.0
pyocto.lon_max = -99.0
pyocto.depth_min = 0.0
pyocto.depth_max = 50.0

# --- 0D velocity model ---
pyocto.vp = 6.0
pyocto.vs = 3.46
# Tightened 2.5 -> 1.5 s on 2026-08-19. This is the association travel-time
# residual budget; at vp=6.0 km/s, 2.5 s permits ~15 km of position slop, which
# with the coarse stock octree grid (reverted 2026-08-10) was loose enough to
# assemble spurious associations out of unrelated picks across the whole
# 700x1000 km search volume. Raising pyocto.n_picks 4 -> 6 the same day enforced
# a phase floor but did NOT fix this: post-change origins were still 62% outside
# the real Delaware Basin zone (vs ~40% baseline), just repackaged as 6-pick
# solutions. Tolerance is the better lever here because it is a GEOMETRIC
# consistency test rather than a count, and tightening it makes association
# cheaper (smaller candidate sets), so unlike re-tightening the location grid it
# carries no runaway-backlog risk. It is also well matched to this failure mode:
# the spurious events sit at large distances from the basin, exactly where a
# constant vp=6.0 km/s 0D model is least valid (real Pn is ~7.8-8.0 km/s), so a
# loose budget disproportionately admits distant junk. Expect some loss of
# genuine regional (>200 km) detections as the cost. Revert to 2.5 if real
# distant events start going missing.
pyocto.tolerance = 1.5

# --- Association ---
pyocto.time_before = 60.0
# Raised 4 -> 6 on 2026-08-19. With the octree grid reverted to coarse stock
# on 2026-08-10 (see the gridding block below), a 4-pick association no longer
# carries enough travel-time consistency to be trustworthy: bare-minimum
# 4- and 5-phase events went from ~0/day (tight grid, which rejected them as
# geometrically inconsistent even though n_picks=4 permitted them) to ~790/day,
# doubling the daily event count from ~610 to ~1240 with a FLAT pick supply
# (~58-62k picks/day before and after). Those origins are demonstrably junk-
# heavy: 64.5% of the 4-phase and 55.7% of the 5-phase events land outside the
# real Delaware Basin seismic zone, versus ~38-40% for 8+ phase events. 6 is
# also scpyocto.py's own built-in default and PyOcto's recommended value; the
# configs were the thing overriding it downward. Dial to 5 if small-event
# detection sensitivity matters more than catalog cleanliness.
pyocto.n_picks = 6
pyocto.n_p_picks = 3
pyocto.n_s_picks = 0
pyocto.n_p_and_s_picks = 0
pyocto.pick_match_tolerance = 2.0
pyocto.min_interevent_time = 3.0
pyocto.time_slicing = 1200.0

# --- Module ---
pyocto.cycle_seconds = 30
pyocto.max_pick_age = 1800
# Separate, much longer age budget for gap_recovery_targeted-sourced picks
# (quakeportal's USGS-missed-event recovery, see gap_recovery.py's
# run_targeted_recovery()). Those picks can be anywhere from ~30 minutes to
# ~7 days stale by the time they reach scmaster -- usgs_sync.py retries
# backlog candidates across its full 7-day MISSED_LOOKBACK_DAYS window, not
# just freshly-noticed events -- so max_pick_age above would silently prune
# essentially all of them before association ever got a chance (confirmed
# 2026-08-11: 81% of all such picks ever published arrived already past
# max_pick_age; a first attempt at this fix using 6h still missed the
# multi-day backlog case). Keeping max_pick_age itself low limits the
# real-time buffer's per-cycle octree-association cost for everything else;
# this only widens the window for the recovery pathway specifically, sized
# to that 7-day design window plus a day of margin.
pyocto.targeted_recovery_max_age = 691200

# --- Octree gridding / discretization ---
# PyOcto's stock defaults (10.0 / 1.5 / 6 / 4 / 3). Previously tightened
# (min_node_size_location 0.5, location_split_depth 8, refinement_iterations 4)
# to remove lat/lon-aligned grid artifacts in epicenter maps, but that made
# each association cycle expensive enough to fall behind under load and enter
# a runaway backlog (buffer grows -> cycle gets slower -> buffer grows more).
# Reverted to stock to prioritize keeping up with real-time pick volume;
# revisit only after the backlog issue is confirmed resolved.
pyocto.min_node_size = 10.0
pyocto.min_node_size_location = 1.5
pyocto.location_split_depth = 6
pyocto.location_split_return = 4
pyocto.refinement_iterations = 3
